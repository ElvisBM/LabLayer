name: Inspect n8n Server

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Inspect n8n runtime on VPS
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          ssh "$HOSTINGER_USER@$HOSTINGER_HOST" '
            set -e
            echo "HOSTNAME=$(hostname)"
            echo "DOCKER_PRESENT=$(command -v docker >/dev/null 2>&1 && echo yes || echo no)"
            echo "PM2_PRESENT=$(command -v pm2 >/dev/null 2>&1 && echo yes || echo no)"
            echo "N8N_PRESENT=$(command -v n8n >/dev/null 2>&1 && echo yes || echo no)"
            if command -v docker >/dev/null 2>&1; then
              echo "--- docker ps"
              docker ps --format "{{.Names}}\t{{.Image}}\t{{.Status}}" | grep -i n8n || true
            fi
            if command -v pm2 >/dev/null 2>&1; then
              echo "--- pm2 list"
              pm2 list || true
            fi
            if command -v systemctl >/dev/null 2>&1; then
              echo "--- systemctl n8n"
              systemctl status n8n --no-pager || true
            fi
          '
