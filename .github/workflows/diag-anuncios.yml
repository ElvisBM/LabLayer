name: Diagnostico anuncios (somente leitura)

on:
  push:
    branches: [claude/project-thread-9aqbry]
    paths: [.github/workflows/diag-anuncios.yml]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Read-only checks on VPS
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          ssh "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE' | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]+/[email]/g'
          set +e
          cd /var/www/lablayer/app
          K=$(grep '^LABLAYER_MARKETPLACE_KEY_FILE=' .env.production | cut -d= -f2- | tr -d '"')
          echo "== marketplace key file: $K"; ls -l --time-style=full-iso "$K" 2>&1
          echo "== pm2 error log (last 40)"; pm2 logs lablayer-app --err --nostream --lines 40 2>&1 | cut -c1-220
          echo "== nginx anuncios requests"; (tail -n 5000 /var/log/nginx/access.log 2>&1 | grep -E 'listing-drafts|marketplace-listings' | awk '{print $4, $6, $9}' | sed -E 's#/api/tenants/[^/]+#/api/tenants/T#' | tail -20) 2>&1
          echo "== account and tenant check (read-only)"
          timeout 90 node -e '
          const {initializeApp,cert}=require("firebase-admin/app");const {getFirestore}=require("firebase-admin/firestore");const {getAuth}=require("firebase-admin/auth");
          const fs=require("fs");const cfg=require("./firebase-applet-config.json");
          (async()=>{try{
            initializeApp({credential:cert(JSON.parse(fs.readFileSync("/var/www/lablayer/shared/firebase-service-account.json","utf8")))});
            const db=getFirestore(cfg.firestoreDatabaseId);
            const draftTenant=(await db.collection("privateMarketplaceDrafts").listDocuments())[0]?.id;
            const owner=(await db.doc("tenants/"+draftTenant).get()).data()?.ownerUid; const u=await getAuth().getUser(owner); console.log("owner disabled",u.disabled,"lastSignIn",u.metadata.lastSignInTime);
            const p=(await db.doc("users/"+u.uid).get()).data()||{};
            const sh=x=>x?String(x).slice(0,4)+"…":String(x);
            console.log("profile tenant",sh(p.tenantId),"tenantRole",p.tenantRole,"role",p.role,"claims",JSON.stringify(u.customClaims||{}));
            console.log("draftsTenant",sh(draftTenant),"same",p.tenantId===draftTenant);
            for (const t of [p.tenantId, draftTenant]) { if(!t) continue; const c=(await db.doc("tenants/"+t).get()).data(); const m=await db.doc("tenants/"+t+"/members/"+u.uid).get();
              console.log("tenant",sh(t),"exists",!!c,"status",c?.status,"owner",c?.ownerUid===u.uid,"member",m.exists,m.exists?JSON.stringify({active:m.data().active,role:m.data().role}):""); }
            const us=await db.collection("users").where("tenantId","==",draftTenant).get(); console.log("users in drafts tenant",us.size, JSON.stringify(us.docs.map(d=>({owner:d.id===u.uid,tr:d.data().tenantRole,r:d.data().role}))));
          }catch(e){console.log("ERR",(e.code||"")+" "+String(e.message).slice(0,200));}})();'
          REMOTE
