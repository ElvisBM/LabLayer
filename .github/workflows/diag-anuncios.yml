name: Diagnostico anuncio finalizado (somente leitura)

on:
  push:
    branches: [claude/project-thread-9aqbry]
    paths: [.github/workflows/diag-anuncios.yml]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Read-only checks on VPS
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          ssh "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE' | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]+/[email]/g'
          set +e
          cd /var/www/lablayer/app
          echo "== kit natal listing (read-only)"
          timeout 120 node -e '
          const {initializeApp,cert}=require("firebase-admin/app");const {getFirestore}=require("firebase-admin/firestore");
          const fs=require("fs");const cfg=require("./firebase-applet-config.json");
          (async()=>{try{
            initializeApp({credential:cert(JSON.parse(fs.readFileSync("/var/www/lablayer/shared/firebase-service-account.json","utf8")))});
            const db=getFirestore(cfg.firestoreDatabaseId);
            const t=(await db.collection("privateMarketplaceDrafts").listDocuments())[0].id;
            const conn=(await db.doc("privateMarketplaceConnections/"+t).get()).data()||{};
            const ids=new Set();
            const drafts=await db.collection("privateMarketplaceDrafts/"+t+"/items").get();
            for (const d of drafts.docs){const x=d.data();const title=String(x.title||x.draft?.title||x.payload?.title||"");
              if(/natal|rena|papai/i.test(title)){console.log("DRAFT",JSON.stringify({title:title.slice(0,90),status:x.status,itemId:x.itemId,remoteStatus:x.remoteStatus,updatedAt:x.updatedAt,message:String(x.message||"").slice(0,160)}));if(x.itemId)ids.add(x.itemId);}}
            const logs=await db.collection("tenants/"+t+"/auditLogs").orderBy("createdAt","desc").limit(300).get();
            for (const l of logs.docs){const x=l.data();if(String(x.operation).startsWith("marketplace"))console.log("AUDIT",JSON.stringify({op:x.operation,itemId:x.itemId,at:x.createdAt,changes:x.changes?Object.keys(x.changes):undefined}).slice(0,300));}
            const ops=await db.collectionGroup("listingOperations").limit(1).get().catch(()=>null);
            console.log("sellerId present",!!conn.sellerId);
            const H={Accept:"application/json","User-Agent":"LabLayer/1.0"};
            if(ids.size===0 && conn.sellerId){const r=await fetch("https://api.mercadolibre.com/sites/MLB/search?seller_id="+conn.sellerId+"&q="+encodeURIComponent("Kit Natal Rena Papai Noel Tricô"),{headers:H});const j=await r.json();console.log("search",r.status,JSON.stringify((j.results||[]).map(i=>[i.id,i.title.slice(0,60)])).slice(0,600));(j.results||[]).filter(i=>/rena/i.test(i.title)).forEach(i=>ids.add(i.id));}
            for (const id of ids){const r=await fetch("https://api.mercadolibre.com/items/"+id,{headers:H});const j=await r.json();
              console.log("ITEM",id,r.status,JSON.stringify({title:j.title,status:j.status,sub_status:j.sub_status,tags:j.tags,health:j.health,available_quantity:j.available_quantity,sold_quantity:j.sold_quantity,listing_type_id:j.listing_type_id,date_created:j.date_created,last_updated:j.last_updated,stop_time:j.stop_time,category_id:j.category_id,warnings:j.warnings,sale_terms:(j.sale_terms||[]).map(s=>s.id+"="+s.value_name),pictures:(j.pictures||[]).length}).slice(0,1500));}
          }catch(e){console.log("ERR",(e.code||"")+" "+String(e.message).slice(0,200));}})();'
          REMOTE
