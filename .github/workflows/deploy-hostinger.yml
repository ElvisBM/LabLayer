name: Deploy Hostinger VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - 'releases/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate Types
        run: npm run lint

      - name: Build App
        run: npm run build

      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync Project Files
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.env.*' \
            ./ "$HOSTINGER_USER@$HOSTINGER_HOST:/var/www/lablayer/app/"

      - name: Install, Build and Restart on VPS
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIRESTORE_DATABASE_ID: ai-studio-914d19ee-caef-46d9-9cf8-561cc915d716
        run: |
          ssh "$HOSTINGER_USER@$HOSTINGER_HOST" "
            set -e
            mkdir -p /var/www/lablayer/shared
            cd /var/www/lablayer/app
            touch .env.production
            if grep -q '^ADMIN_API_TOKEN=' .env.production; then
              perl -0pi -e 's/^ADMIN_API_TOKEN=.*/ADMIN_API_TOKEN=\"${ADMIN_API_TOKEN}\"/m' .env.production
            else
              printf '\nADMIN_API_TOKEN=\"%s\"\n' '${ADMIN_API_TOKEN}' >> .env.production
            fi
            python3 -c 'from pathlib import Path; env_path = Path(".env.production"); lines = env_path.read_text().splitlines() if env_path.exists() else []; filtered = [line for line in lines if not (line.startswith("FIREBASE_SERVICE_ACCOUNT=") or line.startswith("FIREBASE_SERVICE_ACCOUNT_FILE=") or line.startswith("FIRESTORE_DATABASE_ID="))]; env_path.write_text(("\\n".join(filtered).strip() + "\\n") if filtered else "")'
            printf '%s' '${FIREBASE_SERVICE_ACCOUNT}' > /var/www/lablayer/shared/firebase-service-account.json
            chmod 600 /var/www/lablayer/shared/firebase-service-account.json
            printf 'FIREBASE_SERVICE_ACCOUNT_FILE=\"%s\"\n' '/var/www/lablayer/shared/firebase-service-account.json' >> .env.production
            printf 'FIRESTORE_DATABASE_ID=\"%s\"\n' '${FIRESTORE_DATABASE_ID}' >> .env.production
            npm ci
            npm run build
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save
          "
