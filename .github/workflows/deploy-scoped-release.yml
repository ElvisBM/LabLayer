name: Deploy scoped LabLayer release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect live source or deploy the scoped app release
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - deploy
      release:
        description: Release package to inspect or publish
        required: true
        type: choice
        default: approval-review-20261105
        options:
          - approval-review-20261105
          - marketplace-validation-feedback-20261105
          - marketplace-categories-20261106
          - app-stock-state-fallback-20261106

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release package
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Capture current server files for safe rebase
        if: ${{ inputs.action == 'inspect' }}
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          mkdir -p live-snapshot/server live-snapshot/shared/assistant live-snapshot/src/features/assistant live-snapshot/src/views live-snapshot/dist
          ssh "$HOSTINGER_USER@$HOSTINGER_HOST" "cd /var/www/lablayer/app && sha256sum server/assistant.ts server/assistant-ai.ts server/marketplace-drafts.ts shared/assistant/workflow.ts src/features/assistant/AssistantChat.tsx src/features/assistant/AssistantStatusUpdate.tsx src/views/EncomendasOrcamentos.tsx dist/index.html"
          for path in server/assistant.ts server/assistant-ai.ts server/marketplace-drafts.ts shared/assistant/workflow.ts src/features/assistant/AssistantChat.tsx src/features/assistant/AssistantStatusUpdate.tsx src/views/EncomendasOrcamentos.tsx dist/index.html; do
            mkdir -p "live-snapshot/$(dirname "$path")"
            scp "$HOSTINGER_USER@$HOSTINGER_HOST:/var/www/lablayer/app/$path" "live-snapshot/$path"
          done

      - name: Save current server snapshot
        if: ${{ inputs.action == 'inspect' }}
        uses: actions/upload-artifact@v4
        with:
          name: lablayer-live-snapshot-${{ github.run_id }}
          path: live-snapshot/
          retention-days: 1

      - name: Verify release package
        if: ${{ inputs.action == 'deploy' }}
        env:
          RELEASE_ID: ${{ inputs.release }}
        run: |
          cd "releases/$RELEASE_ID"
          sha256sum --check release.tar.gz.sha256

      - name: Upload scoped package
        if: ${{ inputs.action == 'deploy' }}
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          RELEASE_ID: ${{ inputs.release }}
        run: |
          ssh "$HOSTINGER_USER@$HOSTINGER_HOST" "mkdir -p \"\$HOME/releases/$RELEASE_ID\""
          scp "releases/$RELEASE_ID/release.tar.gz" "$HOSTINGER_USER@$HOSTINGER_HOST:releases/$RELEASE_ID/release.tar.gz"

      - name: Apply release with backup and health check
        if: ${{ inputs.action == 'deploy' }}
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          RELEASE_ID: ${{ inputs.release }}
        run: |
          ssh "$HOSTINGER_USER@$HOSTINGER_HOST" "set -e; cd \"\$HOME/releases/$RELEASE_ID\"; tar -xzf release.tar.gz; bash ./publish.sh"

      - name: Verify public health endpoint
        if: ${{ inputs.action == 'deploy' }}
        run: curl --fail --silent --show-error https://app.lablayer.com.br/api/health
